# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mender-community-rockchip"
BBFILE_PATTERN_mender-community-rockchip = "^${LAYERDIR}/"
BBFILE_PRIORITY_mender-community-rockchip = "10"

LAYERSERIES_COMPAT_mender-community-rockchip = "wrynose"