# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mender-community-coral"
BBFILE_PATTERN_mender-community-coral = "^${LAYERDIR}/"
BBFILE_PRIORITY_mender-community-coral = "10"

LAYERSERIES_COMPAT_mender-community-coral = "wrynose"

LAYERDEPENDS_mender-community-coral = "mender"
LAYERRECOMMENDS_mender-community-coral = "coral-bsp"